name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==17.0.6
      - run: python tools/check_style.py
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: macos-15
    strategy:
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: e4748cc081bf060302c7d3c44a643ce1d11b7e1d
          path: Lilu
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 418bf14c9fa6044e628eaee4e4da3479ceebd3cb
          path: MacKernelSDK
      - run: python3 tools/build.py --configuration ${{ matrix.configuration }}
