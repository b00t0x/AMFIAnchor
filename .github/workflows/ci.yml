name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style-and-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==17.0.6
      - run: python tools/check_style.py
      - run: python -m unittest discover -s tests -v

  build:
    needs: style-and-tools
    runs-on: macos-15-intel
    strategy:
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: acidanthera/Lilu
          ref: e4748cc081bf060302c7d3c44a643ce1d11b7e1d
          path: Lilu
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: MacKernelSDK
          persist-credentials: false
      - run: python3 tools/build.py --configuration ${{ matrix.configuration }}
      - name: Package kexts
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          distribution="AMFIAnchor-$CONFIGURATION"
          stage="$RUNNER_TEMP/$distribution"
          mkdir "$stage"
          cp -R "build/$CONFIGURATION/AMFIAnchor.kext" Injectors/AMFIAnchor-b00t0x.kext "$stage/"
          cp "build/$CONFIGURATION/manifest.json" LICENSE.txt NOTICES.md "$stage/"
          cp -R LICENSES "$stage/"
          ditto -c -k --norsrc --keepParent "$stage" "build/$distribution.zip"
      - uses: actions/upload-artifact@v7
        with:
          path: build/AMFIAnchor-${{ matrix.configuration }}.zip
          archive: false
          if-no-files-found: error
